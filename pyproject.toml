[project]
name = "reflets"
version = "0.4.0"
description = "A composing companion for MuseScore Studio, served over MCP"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.2",
    "websockets>=13",
    "sheet-music-analysis @ git+https://github.com/Vedat-Ozkan/sheet-music-analysis@v0.2.0",  # the engine; brings music21, required for check (spec open question 7)
]

[project.optional-dependencies]
hum = ["swift-f0>=0.3", "onnxruntime>=1.20", "sounddevice>=0.5", "numpy>=1.26"]

[project.scripts]
reflets = "reflets.server:main"

[dependency-groups]
dev = ["pytest>=8"]
hum-eval = ["swift-f0>=0.3", "onnxruntime>=1.20", "soundfile>=0.13", "soxr>=0.5", "mir_eval>=0.8", "pretty_midi>=0.2", "remotezip>=0.12"]  # eval/hum_eval.py only

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["reflets"]

[tool.hatch.build.targets.wheel.force-include]
"plugin/reflets-bridge.qml" = "reflets/reflets-bridge.qml"

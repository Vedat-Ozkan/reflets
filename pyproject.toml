[project]
name = "reflets"
version = "0.3.2"
description = "A composing companion for MuseScore Studio, served over MCP"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.2",
    "websockets>=13",
    "sheet-music-analysis @ git+https://github.com/Vedat-Ozkan/sheet-music-analysis@v0.1.0",  # the engine; brings music21, required for check (spec open question 7)
]

[project.scripts]
reflets = "reflets.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["reflets"]

[tool.hatch.build.targets.wheel.force-include]
"plugin/reflets-bridge.qml" = "reflets/reflets-bridge.qml"
